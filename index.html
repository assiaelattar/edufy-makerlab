<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Atlas" />
  <meta name="description" content="Atlas by Edufy - education operations, learning, finance, and tenant management." />

  <title>Atlas by Edufy</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            spark: ['Nunito', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        },
      },
    }
  </script>
  <script type="importmap">
  {
    "imports": {
      "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "path": "https://aistudiocdn.com/path@^0.12.7",
      "xlsx": "https://aistudiocdn.com/xlsx@^0.18.5",
      "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "vite": "https://aistudiocdn.com/vite@^7.2.4",
      "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
    }
  }
  </script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-950 text-slate-200 antialiased selection:bg-teal-500 selection:text-white overscroll-none">
  <div id="splash" class="atlas-boot-screen" role="status" aria-live="polite" aria-label="Starting Edufy Atlas">
    <div class="atlas-boot-grid" aria-hidden="true"></div>

    <div class="atlas-boot-content">
      <div class="atlas-boot-board" aria-hidden="true">
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-cell atlas-boot-cell--core"><i></i><i></i><i></i><i></i></span>
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-cell"></span>
        <span class="atlas-boot-scan"></span>
      </div>

      <div class="atlas-boot-brand" aria-hidden="true">
        <span class="atlas-boot-brand__eyebrow">Edufy</span>
        <strong>Atlas</strong>
        <span class="atlas-boot-brand__edition">Academy OS</span>
      </div>

      <div class="atlas-boot-status" aria-hidden="true">
        <span class="atlas-boot-status__pulse"></span>
        <span>Starting your academy workspace</span>
      </div>

      <div class="atlas-boot-progress" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>

  <script>
    const splashRoot = document.getElementById('root');
    const splash = document.getElementById('splash');

    const hideSplash = () => {
      if (!splash) return;
      splash.classList.add('atlas-boot-screen--leaving');
      setTimeout(() => splash.remove(), 260);
    };

    const observer = new MutationObserver(() => {
      if (splashRoot && splashRoot.children.length > 0) {
        observer.disconnect();
        setTimeout(hideSplash, 160);
      }
    });

    if (splashRoot) observer.observe(splashRoot, { childList: true });
    setTimeout(hideSplash, 5000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('[SW] registered:', registration.scope))
          .catch(error => console.warn('[SW] registration failed:', error));
      });
    }
  </script>
</body>

</html>
